name: Asian Sweep Triage Staged Extended Research

on:
  pull_request:
    paths:
      - ".github/workflows/asia-sweep-triage-staged-extended.yml"
      - "src/dtr_lab/strategies/asia_sweep/triage_modeling_v2.py"
      - "src/dtr_lab/strategies/asia_sweep/staged_execution_v2.py"
      - "src/dtr_lab/strategies/asia_sweep/extended_targets.py"
      - "src/dtr_lab/strategies/asia_sweep/extended_target_modeling.py"
      - "scripts/run_asia_sweep_triage_development.py"
      - "scripts/run_asia_sweep_staged_feasibility.py"
      - "scripts/build_asia_sweep_extended_targets.py"
      - "scripts/run_asia_sweep_extended_candidate.py"
      - "scripts/aggregate_asia_sweep_extended_targets.py"
      - "strategies/asia_sweep/tests/test_triage_staged_extended.py"
      - "strategies/asia_sweep/TRIAGE_*"
      - "strategies/asia_sweep/STAGED_*"
      - "strategies/asia_sweep/EXTENDED_*"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: asia-sweep-triage-staged-extended-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EARLY_ENTRY_RUN_ID: "30197859712"
  QUALIFIED_SOURCE_RUN_ID: "30111481052"

jobs:
  contract:
    name: Validate causal research contract
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.head_ref == 'agent/asia-sweep-triage-staged-extended'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,research]"
      - name: Run causal falsification tests
        run: |
          pytest strategies/asia_sweep/tests/test_triage_staged_extended.py \
            --junitxml="${RUNNER_TEMP}/triage-staged-extended-tests.xml"
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asia-sweep-triage-staged-extended-test-diagnostics
          path: ${{ runner.temp }}/triage-staged-extended-tests.xml
          if-no-files-found: warn
          retention-days: 30
      - name: Lint research implementation
        run: |
          ruff check \
            src/dtr_lab/strategies/asia_sweep/triage_modeling_v2.py \
            src/dtr_lab/strategies/asia_sweep/staged_execution_v2.py \
            src/dtr_lab/strategies/asia_sweep/extended_targets.py \
            src/dtr_lab/strategies/asia_sweep/extended_target_modeling.py \
            scripts/run_asia_sweep_triage_development.py \
            scripts/run_asia_sweep_staged_feasibility.py \
            scripts/build_asia_sweep_extended_targets.py \
            scripts/run_asia_sweep_extended_candidate.py \
            scripts/aggregate_asia_sweep_extended_targets.py \
            strategies/asia_sweep/tests/test_triage_staged_extended.py

  triage_development:
    name: Run corrected triage development
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[research]"
      - name: Download immutable early-entry evidence
        uses: actions/download-artifact@v4
        with:
          name: asia-sweep-early-entry-frontier-decision
          path: ${{ runner.temp }}/early-entry
          repository: market-predictions/dtr
          run-id: ${{ env.EARLY_ENTRY_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enforce immutable triage input
        run: test -s "${RUNNER_TEMP}/early-entry/early_entry_landmark_ledger.csv"
      - name: Run fully group-held-out triage frontier
        run: |
          python scripts/run_asia_sweep_triage_development.py \
            --ledger "${RUNNER_TEMP}/early-entry/early_entry_landmark_ledger.csv" \
            --out "${RUNNER_TEMP}/triage"
      - name: Upload triage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asia-sweep-triage-development-decision
          path: ${{ runner.temp }}/triage
          if-no-files-found: warn
          retention-days: 90

  staged_feasibility:
    name: Run staged-entry development feasibility
    needs: triage_development
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Download immutable early-entry evidence
        uses: actions/download-artifact@v4
        with:
          name: asia-sweep-early-entry-frontier-decision
          path: ${{ runner.temp }}/early-entry
          repository: market-predictions/dtr
          run-id: ${{ env.EARLY_ENTRY_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download corrected triage evidence
        uses: actions/download-artifact@v4
        with:
          name: asia-sweep-triage-development-decision
          path: ${{ runner.temp }}/triage
      - name: Download qualified pair sources
        uses: actions/download-artifact@v4
        with:
          pattern: stacey-burke-fx-source-*
          path: ${{ runner.temp }}/source
          merge-multiple: false
          repository: market-predictions/dtr
          run-id: ${{ env.QUALIFIED_SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize source directories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/normalized-source/EURUSD" "${RUNNER_TEMP}/normalized-source/GBPUSD"
          find "${RUNNER_TEMP}/source" -iname 'eurusd_m1_*.csv.gz' -exec cp {} "${RUNNER_TEMP}/normalized-source/EURUSD/" \;
          find "${RUNNER_TEMP}/source" -iname 'gbpusd_m1_*.csv.gz' -exec cp {} "${RUNNER_TEMP}/normalized-source/GBPUSD/" \;
          test "$(find "${RUNNER_TEMP}/normalized-source/EURUSD" -name '*.csv.gz' | wc -l)" -ge 10
          test "$(find "${RUNNER_TEMP}/normalized-source/GBPUSD" -name '*.csv.gz' | wc -l)" -ge 10
      - name: Run source-backed staged feasibility
        run: |
          python scripts/run_asia_sweep_staged_feasibility.py \
            --ledger "${RUNNER_TEMP}/early-entry/early_entry_landmark_ledger.csv" \
            --triage "${RUNNER_TEMP}/triage" \
            --source-root "${RUNNER_TEMP}/normalized-source" \
            --out "${RUNNER_TEMP}/staged"
      - name: Upload staged evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asia-sweep-staged-feasibility-decision
          path: ${{ runner.temp }}/staged
          if-no-files-found: warn
          retention-days: 90

  extended_labels:
    name: Build extended target labels ${{ matrix.symbol }}
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        symbol: [EURUSD, GBPUSD]
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Download immutable early-entry evidence
        uses: actions/download-artifact@v4
        with:
          name: asia-sweep-early-entry-frontier-decision
          path: ${{ runner.temp }}/early-entry
          repository: market-predictions/dtr
          run-id: ${{ env.EARLY_ENTRY_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download qualified source
        uses: actions/download-artifact@v4
        with:
          name: stacey-burke-fx-source-${{ matrix.symbol }}
          path: ${{ runner.temp }}/source/${{ matrix.symbol }}
          repository: market-predictions/dtr
          run-id: ${{ env.QUALIFIED_SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build executable extended labels
        run: |
          python scripts/build_asia_sweep_extended_targets.py \
            --ledger "${RUNNER_TEMP}/early-entry/early_entry_landmark_ledger.csv" \
            --source-root "${RUNNER_TEMP}/source" \
            --symbol "${{ matrix.symbol }}" \
            --out "${RUNNER_TEMP}/extended-labels/${{ matrix.symbol }}"
      - name: Upload extended label evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asia-sweep-extended-labels-${{ matrix.symbol }}
          path: ${{ runner.temp }}/extended-labels/${{ matrix.symbol }}
          if-no-files-found: warn
          retention-days: 90

  extended_candidates:
    name: Fit ${{ matrix.landmark }} ${{ matrix.target }} ${{ matrix.family }}
    needs: extended_labels
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        landmark: [T0, T1]
        target:
          - EXTENDED_1_5R_1300
          - EXTENDED_2R_1300
          - EXTENDED_3R_1600
          - OPPOSITE_ASIAN_BOUNDARY_1300
          - LATE_TREND_HOLD_1600
        family: [elastic_net, hgb]
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[research]"
      - name: Download pair label evidence
        uses: actions/download-artifact@v4
        with:
          pattern: asia-sweep-extended-labels-*
          path: ${{ runner.temp }}/extended-labels
          merge-multiple: false
      - name: Fit grouped extended target candidate
        run: |
          python scripts/run_asia_sweep_extended_candidate.py \
            --ledgers "${RUNNER_TEMP}/extended-labels" \
            --landmark "${{ matrix.landmark }}" \
            --target "${{ matrix.target }}" \
            --family "${{ matrix.family }}" \
            --out "${RUNNER_TEMP}/candidate"
      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extended-${{ matrix.landmark }}-${{ matrix.target }}-${{ matrix.family }}
          path: ${{ runner.temp }}/candidate
          if-no-files-found: warn
          retention-days: 90

  extended_decision:
    name: Aggregate extended target decision
    needs: extended_candidates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .
      - name: Download candidate evidence
        uses: actions/download-artifact@v4
        with:
          pattern: extended-*
          path: ${{ runner.temp }}/candidates
          merge-multiple: false
      - name: Aggregate frozen target decision
        run: |
          python scripts/aggregate_asia_sweep_extended_targets.py \
            --inputs "${RUNNER_TEMP}/candidates" \
            --out "${RUNNER_TEMP}/extended-decision"
      - name: Upload extended decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asia-sweep-extended-target-decision
          path: ${{ runner.temp }}/extended-decision
          if-no-files-found: warn
          retention-days: 90
