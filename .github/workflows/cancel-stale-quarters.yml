name: Cancel Stale Quarters Run

on:
  push:
    branches:
      - agent/quarters-theory-crosspair
    paths:
      - .github/workflows/cancel-stale-quarters.yml

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel obsolete sequential run
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.actions.cancelWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: 31020445564,
              });
              core.info('Cancellation requested for stale run 31020445564.');
            } catch (error) {
              if (error.status === 409) {
                core.info('Stale run is already completed or cancelling.');
              } else {
                throw error;
              }
            }
