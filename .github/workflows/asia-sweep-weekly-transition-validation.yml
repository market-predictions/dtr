name: Asian Sweep Weekly Transition Validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: asia-sweep-weekly-transition-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  QUALIFIED_SOURCE_RUN_ID: "30111481052"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  confirmation:
    name: Confirm weekly transition on 2020-2022
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,research]"
      - name: Validate frozen transition contract
        run: |
          pytest strategies/asia_sweep/tests/test_weekly_transition_validation.py
          ruff check \
            src/dtr_lab/strategies/asia_sweep/transition_target_builder.py \
            src/dtr_lab/strategies/asia_sweep/weekly_transition_validation.py \
            scripts/run_asia_sweep_transition_anatomy.py \
            scripts/run_asia_sweep_transition_targets.py \
            scripts/run_asia_sweep_weekly_transition_pair.py \
            scripts/aggregate_asia_sweep_weekly_transition.py \
            strategies/asia_sweep/tests/test_weekly_transition_validation.py
      - name: Restore EURUSD qualified source cache
        id: eur-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/source/EURUSD
          key: stacey-burke-fx-v1-EURUSD-2015-2026-07-24
      - name: Download EURUSD source on cache miss
        if: steps.eur-cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: stacey-burke-fx-source-EURUSD
          path: ${{ runner.temp }}/source/EURUSD
          repository: market-predictions/dtr
          run-id: ${{ env.QUALIFIED_SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore GBPUSD qualified source cache
        id: gbp-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/source/GBPUSD
          key: stacey-burke-fx-v1-GBPUSD-2015-2026-07-24
      - name: Download GBPUSD source on cache miss
        if: steps.gbp-cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: stacey-burke-fx-source-GBPUSD
          path: ${{ runner.temp }}/source/GBPUSD
          repository: market-predictions/dtr
          run-id: ${{ env.QUALIFIED_SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Isolate 2019 warm-up and 2020-2022 confirmation source
        shell: bash
        run: |
          set -euo pipefail
          for symbol in EURUSD GBPUSD; do
            lower="${symbol,,}"
            stage="${RUNNER_TEMP}/confirmation-source/${symbol}"
            mkdir -p "${stage}"
            for year in 2019 2020 2021 2022; do
              for side in bid ask; do
                source="${RUNNER_TEMP}/source/${symbol}/${lower}_m1_${side}_${year}.csv.gz"
                test -s "${source}"
                cp "${source}" "${stage}/"
              done
            done
            test "$(find "${stage}" -maxdepth 1 -name '*.csv.gz' -type f | wc -l)" -eq 8
            if find "${stage}" -maxdepth 1 -type f \
              \( -name '*_2023.csv.gz' -o -name '*_2024.csv.gz' -o -name '*_2025.csv.gz' \) \
              | grep -q .; then
              echo "Final-holdout file entered confirmation source"
              exit 1
            fi
          done
      - name: Reconstruct confirmation ledgers
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/weekly-transition/confirmation"
          for symbol in EURUSD GBPUSD; do
            source="${RUNNER_TEMP}/confirmation-source/${symbol}"
            pair="${root}/${symbol}"
            anatomy="${pair}/anatomy"
            landmarks="${pair}/landmarks"
            targets="${pair}/targets"
            enriched="${pair}/enriched"
            mkdir -p "${anatomy}" "${landmarks}" "${targets}" "${enriched}"
            python scripts/run_asia_sweep_transition_anatomy.py \
              --data "${source}" \
              --symbol "${symbol}" \
              --start-year 2019 \
              --end-year 2022 \
              --out "${anatomy}"
            python scripts/run_asia_sweep_early_entry_pair.py \
              --data "${source}" \
              --events "${anatomy}/fingerprint_events.csv" \
              --levels "${anatomy}/fingerprint_levels.csv" \
              --symbol "${symbol}" \
              --start-year 2020 \
              --end-year 2022 \
              --out "${landmarks}"
            python scripts/run_asia_sweep_transition_targets.py \
              --data "${source}" \
              --ledger "${landmarks}/early_entry_landmarks.csv" \
              --levels "${anatomy}/opposing_liquidity_levels.csv" \
              --symbol "${symbol}" \
              --start-year 2020 \
              --end-year 2022 \
              --out "${targets}"
            python scripts/run_asia_sweep_weekly_transition_pair.py \
              --data "${source}" \
              --targets "${targets}/transition_extended_targets.csv" \
              --symbol "${symbol}" \
              --warmup-start-year 2019 \
              --start-year 2020 \
              --end-year 2022 \
              --out "${enriched}"
          done
      - name: Aggregate frozen confirmation gate
        run: |
          root="${RUNNER_TEMP}/weekly-transition/confirmation"
          mkdir -p "${root}/decision"
          python scripts/aggregate_asia_sweep_weekly_transition.py \
            --stage confirmation \
            --inputs \
              "${root}/EURUSD/enriched/weekly_transition_enriched.csv" \
              "${root}/GBPUSD/enriched/weekly_transition_enriched.csv" \
            --out "${root}/decision"
      - name: Upload complete confirmation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asia-sweep-weekly-transition-confirmation
          path: ${{ runner.temp }}/weekly-transition/confirmation
          if-no-files-found: warn
          retention-days: 90
      - name: Enforce confirmation authorization
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = (
              Path(os.environ["RUNNER_TEMP"])
              / "weekly-transition"
              / "confirmation"
              / "decision"
              / "weekly_transition_decision.json"
          )
          payload = json.loads(path.read_text(encoding="utf-8"))
          code = payload["decision"]
          print(f"Scientific decision: {code}")
          expected = "PASS_WEEKLY_TRANSITION_CONFIRMATION_OPEN_FINAL_HOLDOUT"
          if code != expected:
              raise SystemExit(code)
          PY

  final_holdout:
    name: Validate unchanged rule on 2023-2025
    needs: confirmation
    if: needs.confirmation.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[research]"
      - name: Restore EURUSD qualified source cache
        id: eur-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/source/EURUSD
          key: stacey-burke-fx-v1-EURUSD-2015-2026-07-24
      - name: Download EURUSD source on cache miss
        if: steps.eur-cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: stacey-burke-fx-source-EURUSD
          path: ${{ runner.temp }}/source/EURUSD
          repository: market-predictions/dtr
          run-id: ${{ env.QUALIFIED_SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore GBPUSD qualified source cache
        id: gbp-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/source/GBPUSD
          key: stacey-burke-fx-v1-GBPUSD-2015-2026-07-24
      - name: Download GBPUSD source on cache miss
        if: steps.gbp-cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: stacey-burke-fx-source-GBPUSD
          path: ${{ runner.temp }}/source/GBPUSD
          repository: market-predictions/dtr
          run-id: ${{ env.QUALIFIED_SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download passed confirmation evidence
        uses: actions/download-artifact@v4
        with:
          name: asia-sweep-weekly-transition-confirmation
          path: ${{ runner.temp }}/passed-confirmation
      - name: Isolate 2022 warm-up and 2023-2025 final source
        shell: bash
        run: |
          set -euo pipefail
          for symbol in EURUSD GBPUSD; do
            lower="${symbol,,}"
            stage="${RUNNER_TEMP}/final-source/${symbol}"
            mkdir -p "${stage}"
            for year in 2022 2023 2024 2025; do
              for side in bid ask; do
                source="${RUNNER_TEMP}/source/${symbol}/${lower}_m1_${side}_${year}.csv.gz"
                test -s "${source}"
                cp "${source}" "${stage}/"
              done
            done
            test "$(find "${stage}" -maxdepth 1 -name '*.csv.gz' -type f | wc -l)" -eq 8
          done
      - name: Reconstruct final-holdout ledgers
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/weekly-transition/final"
          for symbol in EURUSD GBPUSD; do
            source="${RUNNER_TEMP}/final-source/${symbol}"
            pair="${root}/${symbol}"
            anatomy="${pair}/anatomy"
            landmarks="${pair}/landmarks"
            targets="${pair}/targets"
            enriched="${pair}/enriched"
            mkdir -p "${anatomy}" "${landmarks}" "${targets}" "${enriched}"
            python scripts/run_asia_sweep_transition_anatomy.py \
              --data "${source}" \
              --symbol "${symbol}" \
              --start-year 2022 \
              --end-year 2025 \
              --out "${anatomy}"
            python scripts/run_asia_sweep_early_entry_pair.py \
              --data "${source}" \
              --events "${anatomy}/fingerprint_events.csv" \
              --levels "${anatomy}/fingerprint_levels.csv" \
              --symbol "${symbol}" \
              --start-year 2023 \
              --end-year 2025 \
              --out "${landmarks}"
            python scripts/run_asia_sweep_transition_targets.py \
              --data "${source}" \
              --ledger "${landmarks}/early_entry_landmarks.csv" \
              --levels "${anatomy}/opposing_liquidity_levels.csv" \
              --symbol "${symbol}" \
              --start-year 2023 \
              --end-year 2025 \
              --out "${targets}"
            python scripts/run_asia_sweep_weekly_transition_pair.py \
              --data "${source}" \
              --targets "${targets}/transition_extended_targets.csv" \
              --symbol "${symbol}" \
              --warmup-start-year 2022 \
              --start-year 2023 \
              --end-year 2025 \
              --out "${enriched}"
          done
      - name: Locate passed confirmation pair ledgers
        shell: bash
        run: |
          set -euo pipefail
          find "${RUNNER_TEMP}/passed-confirmation" -name weekly_transition_enriched.csv -type f | sort
          test "$(find "${RUNNER_TEMP}/passed-confirmation" -name weekly_transition_enriched.csv -type f | wc -l)" -eq 2
      - name: Aggregate final and combined gates
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/weekly-transition/final"
          mkdir -p "${root}/decision"
          mapfile -t prior < <(
            find "${RUNNER_TEMP}/passed-confirmation" \
              -name weekly_transition_enriched.csv -type f | sort
          )
          python scripts/aggregate_asia_sweep_weekly_transition.py \
            --stage final \
            --inputs \
              "${root}/EURUSD/enriched/weekly_transition_enriched.csv" \
              "${root}/GBPUSD/enriched/weekly_transition_enriched.csv" \
            --prior-inputs "${prior[@]}" \
            --out "${root}/decision"
      - name: Upload complete final evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asia-sweep-weekly-transition-final
          path: ${{ runner.temp }}/weekly-transition/final
          if-no-files-found: warn
          retention-days: 90
      - name: Enforce final authorization
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = (
              Path(os.environ["RUNNER_TEMP"])
              / "weekly-transition"
              / "final"
              / "decision"
              / "weekly_transition_decision.json"
          )
          payload = json.loads(path.read_text(encoding="utf-8"))
          code = payload["decision"]
          print(f"Scientific decision: {code}")
          expected = "PASS_WEEKLY_TRANSITION_FINAL_HOLDOUT_OPEN_EXECUTION_PNL"
          if code != expected:
              raise SystemExit(code)
          PY
