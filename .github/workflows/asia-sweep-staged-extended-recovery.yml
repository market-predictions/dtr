name: Asian Sweep Staged Extended Recovery

on:
  pull_request:
    paths:
      - ".github/workflows/asia-sweep-staged-extended-recovery.yml"
      - "src/dtr_lab/strategies/asia_sweep/staged_execution_v3.py"
      - "scripts/run_asia_sweep_staged_feasibility_v2.py"
      - "strategies/asia_sweep/tests/test_staged_reference_correction.py"
      - "strategies/asia_sweep/STAGED_REFERENCE_CORRECTION_AMENDMENT_V6_5.md"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: asia-sweep-staged-extended-recovery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EARLY_ENTRY_RUN_ID: "30197859712"
  TRIAGE_EXTENDED_RUN_ID: "30201189610"
  QUALIFIED_SOURCE_RUN_ID: "30111481052"

jobs:
  contract:
    name: Validate staged-reference correction
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.head_ref == 'agent/asia-sweep-triage-staged-extended'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,research]"
      - name: Run comparator falsification tests
        run: pytest strategies/asia_sweep/tests/test_staged_reference_correction.py
      - name: Lint recovery implementation
        run: |
          ruff check \
            src/dtr_lab/strategies/asia_sweep/staged_execution_v3.py \
            scripts/run_asia_sweep_staged_feasibility_v2.py \
            strategies/asia_sweep/tests/test_staged_reference_correction.py

  corrected_staged:
    name: Recompute corrected staged feasibility
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Download immutable early-entry evidence
        uses: actions/download-artifact@v4
        with:
          name: asia-sweep-early-entry-frontier-decision
          path: ${{ runner.temp }}/early-entry
          repository: market-predictions/dtr
          run-id: ${{ env.EARLY_ENTRY_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download corrected triage evidence
        uses: actions/download-artifact@v4
        with:
          name: asia-sweep-triage-development-decision
          path: ${{ runner.temp }}/triage
          repository: market-predictions/dtr
          run-id: ${{ env.TRIAGE_EXTENDED_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download qualified pair sources
        uses: actions/download-artifact@v4
        with:
          pattern: stacey-burke-fx-source-*
          path: ${{ runner.temp }}/source
          merge-multiple: false
          repository: market-predictions/dtr
          run-id: ${{ env.QUALIFIED_SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize source directories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/normalized-source/EURUSD" "${RUNNER_TEMP}/normalized-source/GBPUSD"
          find "${RUNNER_TEMP}/source" -iname 'eurusd_m1_*.csv.gz' -exec cp {} "${RUNNER_TEMP}/normalized-source/EURUSD/" \;
          find "${RUNNER_TEMP}/source" -iname 'gbpusd_m1_*.csv.gz' -exec cp {} "${RUNNER_TEMP}/normalized-source/GBPUSD/" \;
          test "$(find "${RUNNER_TEMP}/normalized-source/EURUSD" -name '*.csv.gz' | wc -l)" -ge 10
          test "$(find "${RUNNER_TEMP}/normalized-source/GBPUSD" -name '*.csv.gz' | wc -l)" -ge 10
      - name: Recompute corrected staged feasibility
        run: |
          python scripts/run_asia_sweep_staged_feasibility_v2.py \
            --ledger "${RUNNER_TEMP}/early-entry/early_entry_landmark_ledger.csv" \
            --triage "${RUNNER_TEMP}/triage" \
            --source-root "${RUNNER_TEMP}/normalized-source" \
            --out "${RUNNER_TEMP}/staged"
      - name: Upload corrected staged evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asia-sweep-staged-feasibility-corrected
          path: ${{ runner.temp }}/staged
          if-no-files-found: warn
          retention-days: 90

  recover_extended_decision:
    name: Recover extended target aggregate
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[research]"
      - name: Download retained candidate evidence
        uses: actions/download-artifact@v4
        with:
          pattern: extended-*
          path: ${{ runner.temp }}/candidates
          merge-multiple: false
          repository: market-predictions/dtr
          run-id: ${{ env.TRIAGE_EXTENDED_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enforce twenty candidate summaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(find "${RUNNER_TEMP}/candidates" -name 'extended_summary_*.json' | wc -l)" -eq 20
      - name: Recover frozen extended decision
        run: |
          python scripts/aggregate_asia_sweep_extended_targets.py \
            --inputs "${RUNNER_TEMP}/candidates" \
            --out "${RUNNER_TEMP}/extended-decision"
      - name: Upload recovered extended decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asia-sweep-extended-target-decision-recovered
          path: ${{ runner.temp }}/extended-decision
          if-no-files-found: warn
          retention-days: 90
