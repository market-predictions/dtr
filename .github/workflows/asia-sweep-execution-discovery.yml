name: Asian Sweep Execution Discovery

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: asia-sweep-execution-discovery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  QUALIFIED_SOURCE_RUN_ID: "30111481052"
  DEVELOPMENT_ANATOMY_RUN_ID: "30174245825"
  DEVELOPMENT_MODEL_RUN_ID: "30177831134"

jobs:
  focused_tests:
    name: Validate frozen execution contract
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.head_ref == 'agent/asia-sweep-execution-research'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run execution falsification tests
        run: pytest strategies/asia_sweep/tests/test_execution_strategy.py
      - name: Lint execution implementation
        run: |
          ruff check \
            src/dtr_lab/strategies/asia_sweep/execution_contract.py \
            src/dtr_lab/strategies/asia_sweep/execution_simulator.py \
            src/dtr_lab/strategies/asia_sweep/execution_metrics.py \
            scripts/run_asia_sweep_execution_pair.py \
            scripts/aggregate_asia_sweep_execution_discovery.py \
            strategies/asia_sweep/tests/test_execution_strategy.py

  pair_execution:
    name: Build execution discovery ${{ matrix.symbol }}
    needs: focused_tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        symbol: [EURUSD, GBPUSD]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Restore qualified FX source cache
        id: source-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/source/${{ matrix.symbol }}
          key: stacey-burke-fx-v1-${{ matrix.symbol }}-2015-2026-07-24
      - name: Download qualified source on cache miss
        if: steps.source-cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: stacey-burke-fx-source-${{ matrix.symbol }}
          path: ${{ runner.temp }}/source/${{ matrix.symbol }}
          repository: market-predictions/dtr
          run-id: ${{ env.QUALIFIED_SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download immutable development event ledger
        uses: actions/download-artifact@v4
        with:
          name: asia-sweep-fingerprint-development-${{ matrix.symbol }}
          path: ${{ runner.temp }}/events/${{ matrix.symbol }}
          repository: market-predictions/dtr
          run-id: ${{ env.DEVELOPMENT_ANATOMY_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download out-of-fold model evidence
        uses: actions/download-artifact@v4
        with:
          name: asia-sweep-fingerprint-development-model-decision
          path: ${{ runner.temp }}/model
          repository: market-predictions/dtr
          run-id: ${{ env.DEVELOPMENT_MODEL_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enforce discovery source availability
        shell: bash
        run: |
          set -euo pipefail
          symbol="${{ matrix.symbol }}"
          lower="${symbol,,}"
          for year in 2015 2016 2017 2018 2019; do
            test -s "${RUNNER_TEMP}/source/${symbol}/${lower}_m1_bid_${year}.csv.gz"
            test -s "${RUNNER_TEMP}/source/${symbol}/${lower}_m1_ask_${year}.csv.gz"
          done
          test -s "${RUNNER_TEMP}/events/${symbol}/fingerprint_events.csv"
          test -s "${RUNNER_TEMP}/model/predictions_T5_hgb.csv"
      - name: Simulate frozen execution family
        run: |
          mkdir -p "${RUNNER_TEMP}/execution/${{ matrix.symbol }}"
          python scripts/run_asia_sweep_execution_pair.py \
            --data "${RUNNER_TEMP}/source/${{ matrix.symbol }}" \
            --events "${RUNNER_TEMP}/events/${{ matrix.symbol }}" \
            --predictions "${RUNNER_TEMP}/model" \
            --symbol "${{ matrix.symbol }}" \
            --start-year 2015 \
            --end-year 2019 \
            --out "${RUNNER_TEMP}/execution/${{ matrix.symbol }}"
      - name: Upload pair execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asia-sweep-execution-discovery-${{ matrix.symbol }}
          path: ${{ runner.temp }}/execution/${{ matrix.symbol }}
          if-no-files-found: warn
          retention-days: 90

  discovery_gate:
    name: Enforce execution discovery gate
    needs: pair_execution
    if: always() && needs.pair_execution.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Download pair execution evidence
        uses: actions/download-artifact@v4
        with:
          pattern: asia-sweep-execution-discovery-*
          path: ${{ runner.temp }}/execution-inputs
          merge-multiple: false
      - name: Aggregate frozen discovery gate
        run: |
          python scripts/aggregate_asia_sweep_execution_discovery.py \
            --inputs "${RUNNER_TEMP}/execution-inputs" \
            --out "${RUNNER_TEMP}/execution-decision"
      - name: Upload complete execution decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asia-sweep-execution-discovery-decision
          path: ${{ runner.temp }}/execution-decision
          if-no-files-found: warn
          retention-days: 90
      - name: Enforce frozen scientific decision
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          decision="${RUNNER_TEMP}/execution-decision/execution_discovery_decision.json"
          test -s "${decision}"
          python - "${decision}" <<'PY'
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          print(json.dumps(payload, indent=2, sort_keys=True))
          expected = "PASS_DISCOVERY_FREEZE_AUTHORIZE_EXECUTION_VALIDATION_2020_2021"
          raise SystemExit(0 if payload.get("decision") == expected else 1)
          PY
