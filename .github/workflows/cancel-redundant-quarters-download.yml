name: Cancel Redundant Quarters Download

on:
  push:
    branches:
      - agent/quarters-theory-crosspair
    paths:
      - .github/workflows/cancel-redundant-quarters-download.yml

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel redundant pair-year acquisition
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.actions.cancelWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: 31022542291,
              });
              core.info('Cancellation requested for redundant run 31022542291.');
            } catch (error) {
              if (error.status === 409) {
                core.info('Run is already completed or cancelling.');
              } else {
                throw error;
              }
            }
