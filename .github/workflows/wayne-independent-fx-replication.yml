name: Wayne Independent FX Replication

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: wayne-independent-fx-replication-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  QUALIFIED_SOURCE_RUN_ID: "30111481052"
  PANEL_QUALIFICATION_RUN_ID: "30259833965"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  contract:
    name: Validate frozen replication contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,research]"
      - name: Download frozen panel decision
        uses: actions/download-artifact@v4
        with:
          name: wayne-replication-panel-decision
          path: ${{ runner.temp }}/wayne-panel-decision
          repository: market-predictions/dtr
          run-id: ${{ env.PANEL_QUALIFICATION_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enforce panel authorization
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "wayne-panel-decision"
          path = root / "wayne_replication_panel_decision.json"
          data = json.loads(path.read_text(encoding="utf-8"))
          assert data["decision"] == "PASS_PANEL_QUALIFICATION_OPEN_REPLICATION_OUTCOMES"
          assert data["qualified_pairs"] == ["EURGBP", "EURJPY", "GBPJPY", "NZDUSD"]
          assert data["excluded_pairs"] == []
          assert data["outcome_inspection"] is False
          PY
      - name: Focused tests
        run: |
          pytest \
            tests/test_wayne_direction.py \
            tests/test_wayne_h4_sensitivity.py \
            tests/test_wayne_staged_sequence.py \
            tests/test_wayne_staged_cluster_stats.py \
            tests/test_wayne_replication_panel.py \
            tests/test_wayne_replication_decision.py \
            --junitxml="${RUNNER_TEMP}/wayne-replication-pytest.xml"
      - name: Lint
        run: |
          ruff check \
            src/dtr_lab/strategies/wayne_direction \
            scripts/run_wayne_replication_sequence_pair.py \
            scripts/aggregate_wayne_replication_sequence.py \
            tests/test_wayne_replication_panel.py \
            tests/test_wayne_replication_decision.py
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wayne-replication-contract-diagnostics
          path: ${{ runner.temp }}/wayne-replication-pytest.xml
          if-no-files-found: warn
          retention-days: 30

  pair_sequence:
    name: Build independent sequence ${{ matrix.symbol }}
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        symbol: [EURGBP, EURJPY, GBPJPY, NZDUSD]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[research]"
      - name: Restore qualified FX source cache
        id: source-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/source/${{ matrix.symbol }}
          key: stacey-burke-fx-v1-${{ matrix.symbol }}-2015-2026-07-24
      - name: Download qualified source on cache miss
        if: steps.source-cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: stacey-burke-fx-source-${{ matrix.symbol }}
          path: ${{ runner.temp }}/source/${{ matrix.symbol }}
          repository: market-predictions/dtr
          run-id: ${{ env.QUALIFIED_SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Isolate 2015-2021 source
        shell: bash
        run: |
          set -euo pipefail
          symbol="${{ matrix.symbol }}"
          lower="${symbol,,}"
          stage="${RUNNER_TEMP}/wayne-replication-source/${symbol}"
          mkdir -p "${stage}"
          for year in 2015 2016 2017 2018 2019 2020 2021; do
            for side in bid ask; do
              source="${RUNNER_TEMP}/source/${symbol}/${lower}_m1_${side}_${year}.csv.gz"
              test -s "${source}"
              cp "${source}" "${stage}/"
            done
          done
          test "$(find "${stage}" -maxdepth 1 -name '*.csv.gz' -type f | wc -l)" -eq 14
          if find "${stage}" -maxdepth 1 -type f \
            \( -name '*_2022.csv.gz' -o -name '*_2023.csv.gz' -o -name '*_2024.csv.gz' -o -name '*_2025.csv.gz' \) \
            | grep -q .; then
            echo "Protected post-development source entered replication directory"
            exit 1
          fi
      - name: Build unchanged pair sequence
        shell: bash
        run: |
          set -uo pipefail
          output="${RUNNER_TEMP}/wayne-replication/${{ matrix.symbol }}"
          mkdir -p "${output}"
          set +e
          python scripts/run_wayne_replication_sequence_pair.py \
            --data "${RUNNER_TEMP}/wayne-replication-source/${{ matrix.symbol }}" \
            --symbol "${{ matrix.symbol }}" \
            --start-year 2015 \
            --end-year 2021 \
            --out "${output}" \
            > "${output}/pair-build.log" 2>&1
          status=$?
          set -e
          cat "${output}/pair-build.log"
          exit "${status}"
      - name: Remove raw source
        if: always()
        run: rm -rf "${RUNNER_TEMP}/wayne-replication-source"
      - name: Upload pair sequence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wayne-independent-sequence-${{ matrix.symbol }}
          path: ${{ runner.temp }}/wayne-replication/${{ matrix.symbol }}
          if-no-files-found: warn
          retention-days: 90

  aggregate:
    name: Aggregate independent replication
    needs: pair_sequence
    if: always() && needs.pair_sequence.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[research]"
      - name: Download pair sequences
        uses: actions/download-artifact@v4
        with:
          pattern: wayne-independent-sequence-*
          path: ${{ runner.temp }}/wayne-replication-inputs
          merge-multiple: false
      - name: Enforce complete input set
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/wayne-replication-inputs"
          test "$(find "${root}" -name wayne_replication_pair_summary.json | wc -l)" -eq 4
          test "$(find "${root}" -name wayne_replication_sequence_ledger.csv | wc -l)" -eq 4
      - name: Aggregate independent decision
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/wayne-replication-inputs"
          mapfile -t summaries < <(
            find "${root}" -name wayne_replication_pair_summary.json -type f | sort
          )
          mapfile -t ledgers < <(
            find "${root}" -name wayne_replication_sequence_ledger.csv -type f | sort
          )
          output="${RUNNER_TEMP}/wayne-replication-decision"
          mkdir -p "${output}"
          python scripts/aggregate_wayne_replication_sequence.py \
            --summaries "${summaries[@]}" \
            --ledgers "${ledgers[@]}" \
            --out "${output}"
      - name: Upload independent replication decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wayne-independent-fx-replication-decision
          path: ${{ runner.temp }}/wayne-replication-decision
          if-no-files-found: warn
          retention-days: 90
