name: Wayne Staged Clustered Aggregate

on:
  pull_request:
    paths:
      - "src/dtr_lab/strategies/wayne_direction/cluster_stats.py"
      - "scripts/aggregate_wayne_staged_sequence_clustered.py"
      - "tests/test_wayne_staged_cluster_stats.py"
      - ".github/workflows/wayne-staged-clustered-aggregate.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: wayne-staged-clustered-aggregate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_RUN_ID: "30253362740"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  contract:
    name: Validate clustered inference correction
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,research]"
      - name: Focused tests
        run: |
          pytest \
            tests/test_wayne_staged_aggregation.py \
            tests/test_wayne_staged_cluster_stats.py \
            --junitxml="${RUNNER_TEMP}/wayne-staged-clustered-pytest.xml"
      - name: Lint
        run: |
          ruff check \
            src/dtr_lab/strategies/wayne_direction/cluster_stats.py \
            scripts/aggregate_wayne_staged_sequence_clustered.py \
            tests/test_wayne_staged_cluster_stats.py
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wayne-staged-clustered-contract-diagnostics
          path: ${{ runner.temp }}/wayne-staged-clustered-pytest.xml
          if-no-files-found: warn
          retention-days: 30

  aggregate:
    name: Recompute clustered staged decision
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[research]"
      - name: Download frozen pair artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wayne-staged-pair-*
          path: ${{ runner.temp }}/wayne-staged-inputs
          merge-multiple: false
          repository: market-predictions/dtr
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enforce complete frozen input set
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/wayne-staged-inputs"
          test "$(find "${root}" -name wayne_staged_pair_summary.json | wc -l)" -eq 6
          test "$(find "${root}" -name wayne_staged_sequence_ledger.csv | wc -l)" -eq 6
      - name: Recompute clustered decision
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/wayne-staged-inputs"
          mapfile -t summaries < <(
            find "${root}" -name wayne_staged_pair_summary.json -type f | sort
          )
          mapfile -t ledgers < <(
            find "${root}" -name wayne_staged_sequence_ledger.csv -type f | sort
          )
          output="${RUNNER_TEMP}/wayne-staged-clustered-decision"
          mkdir -p "${output}"
          python scripts/aggregate_wayne_staged_sequence_clustered.py \
            --summaries "${summaries[@]}" \
            --ledgers "${ledgers[@]}" \
            --out "${output}"
      - name: Upload corrected decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wayne-staged-monthly-sequence-clustered-decision
          path: ${{ runner.temp }}/wayne-staged-clustered-decision
          if-no-files-found: warn
          retention-days: 90
