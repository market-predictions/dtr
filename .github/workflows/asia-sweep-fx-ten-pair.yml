name: Asian Sweep Ten-Pair FX Discovery

on:
  pull_request:

permissions:
  contents: read
  actions: read

concurrency:
  group: asia-sweep-fx-ten-pair-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  QUALIFIED_SOURCE_RUN_ID: "30111481052"

jobs:
  focused_tests:
    name: Validate Asian Sweep FX implementation
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'agent/asia-sweep-fx-ten-pair'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run focused tests
        run: |
          pytest \
            strategies/asia_sweep/tests/test_auction_state.py \
            strategies/asia_sweep/tests/test_auction_state_causal_regressions.py \
            strategies/asia_sweep/tests/test_fx_ten_pair.py

  discovery:
    name: Discovery ${{ matrix.symbol }}
    needs: focused_tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        symbol:
          - EURUSD
          - GBPUSD
          - USDCHF
          - AUDUSD
          - NZDUSD
          - USDCAD
          - USDJPY
          - EURJPY
          - GBPJPY
          - EURGBP

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Restore qualified immutable FX source cache
        id: source-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/sb-source/${{ matrix.symbol }}
          key: stacey-burke-fx-v1-${{ matrix.symbol }}-2015-2026-07-24

      - name: Download qualified source artifact on cache miss
        if: steps.source-cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: stacey-burke-fx-source-${{ matrix.symbol }}
          path: ${{ runner.temp }}/sb-source/${{ matrix.symbol }}
          repository: market-predictions/dtr
          run-id: ${{ env.QUALIFIED_SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enforce qualified source availability
        shell: bash
        run: |
          set -euo pipefail
          for year in 2015 2016 2017 2018 2019; do
            test -s "${RUNNER_TEMP}/sb-source/${{ matrix.symbol }}/${{ matrix.symbol,, }}_m1_bid_${year}.csv.gz"
            test -s "${RUNNER_TEMP}/sb-source/${{ matrix.symbol }}/${{ matrix.symbol,, }}_m1_ask_${year}.csv.gz"
          done

      - name: Run frozen 2015-2019 discovery mechanism study
        run: |
          mkdir -p "${RUNNER_TEMP}/asia-fx/${{ matrix.symbol }}"
          python scripts/run_asia_sweep_fx_ten_pair.py \
            --data "${RUNNER_TEMP}/sb-source/${{ matrix.symbol }}" \
            --symbol "${{ matrix.symbol }}" \
            --start-year 2015 \
            --end-year 2019 \
            --out "${RUNNER_TEMP}/asia-fx/${{ matrix.symbol }}"
          cat > "${RUNNER_TEMP}/asia-fx/${{ matrix.symbol }}/source_provenance.json" <<EOF
          {
            "qualified_source_run_id": ${QUALIFIED_SOURCE_RUN_ID},
            "artifact_name": "stacey-burke-fx-source-${{ matrix.symbol }}",
            "cache_hit": "${{ steps.source-cache.outputs.cache-hit }}",
            "analysis_start_year": 2015,
            "analysis_end_year": 2019
          }
          EOF

      - name: Upload compact pair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asia-sweep-fx-discovery-${{ matrix.symbol }}
          path: ${{ runner.temp }}/asia-fx/${{ matrix.symbol }}
          if-no-files-found: warn
          retention-days: 90

  aggregate:
    name: Enforce Asian Sweep FX discovery gate
    needs: discovery
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Download available pair evidence
        id: download-evidence
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: asia-sweep-fx-discovery-*
          path: ${{ runner.temp }}/asia-fx-inputs
          merge-multiple: false

      - name: Build discovery decision
        id: gate
        continue-on-error: true
        run: |
          mkdir -p "${RUNNER_TEMP}/asia-fx-inputs"
          python scripts/aggregate_asia_sweep_fx_ten_pair.py \
            --inputs "${RUNNER_TEMP}/asia-fx-inputs" \
            --out "${RUNNER_TEMP}/asia-fx-decision"

      - name: Upload discovery decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asia-sweep-fx-discovery-decision
          path: ${{ runner.temp }}/asia-fx-decision
          if-no-files-found: warn
          retention-days: 90

      - name: Enforce discovery gate
        if: always()
        run: test "${{ steps.gate.outcome }}" = "success"
