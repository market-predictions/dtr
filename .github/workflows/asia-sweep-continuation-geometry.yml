name: Asian Sweep Continuation Geometry

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: asia-sweep-continuation-geometry-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TRIAGE_PHASE_A_RUN_ID: "30203426056"
  EARLY_ENTRY_FRONTIER_RUN_ID: "30197859712"
  DEVELOPMENT_ANATOMY_RUN_ID: "30174245825"
  QUALIFIED_SOURCE_RUN_ID: "30111481052"

jobs:
  focused_tests:
    name: Validate frozen continuation geometry contract
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.head_ref == 'agent/asia-sweep-continuation-geometry'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run continuation geometry tests
        run: pytest strategies/asia_sweep/tests/test_continuation_geometry.py
      - name: Lint continuation geometry implementation
        run: |
          ruff check \
            src/dtr_lab/strategies/asia_sweep/continuation_geometry.py \
            scripts/run_asia_sweep_continuation_geometry_pair.py \
            scripts/aggregate_asia_sweep_continuation_geometry.py \
            strategies/asia_sweep/tests/test_continuation_geometry.py

  pair_geometry:
    name: Continuation geometry ${{ matrix.symbol }}
    needs: focused_tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        symbol: [EURUSD, GBPUSD]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Restore qualified FX source cache
        id: source-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/source/${{ matrix.symbol }}
          key: stacey-burke-fx-v1-${{ matrix.symbol }}-2015-2026-07-24
      - name: Download qualified source on cache miss
        if: steps.source-cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: stacey-burke-fx-source-${{ matrix.symbol }}
          path: ${{ runner.temp }}/source/${{ matrix.symbol }}
          repository: market-predictions/dtr
          run-id: ${{ env.QUALIFIED_SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download frozen triage decision
        uses: actions/download-artifact@v4
        with:
          name: asia-sweep-sequential-triage-phase-a-decision
          path: ${{ runner.temp }}/triage
          repository: market-predictions/dtr
          run-id: ${{ env.TRIAGE_PHASE_A_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download immutable early-entry ledger
        uses: actions/download-artifact@v4
        with:
          name: asia-sweep-early-entry-frontier-decision
          path: ${{ runner.temp }}/early-entry
          repository: market-predictions/dtr
          run-id: ${{ env.EARLY_ENTRY_FRONTIER_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download immutable anatomy levels
        uses: actions/download-artifact@v4
        with:
          name: asia-sweep-fingerprint-development-${{ matrix.symbol }}
          path: ${{ runner.temp }}/anatomy/${{ matrix.symbol }}
          repository: market-predictions/dtr
          run-id: ${{ env.DEVELOPMENT_ANATOMY_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enforce pair inputs
        shell: bash
        run: |
          set -euo pipefail
          symbol="${{ matrix.symbol }}"
          lower="${symbol,,}"
          test -s "${RUNNER_TEMP}/triage/selected_continuation_predictions.csv"
          test -s "${RUNNER_TEMP}/early-entry/early_entry_landmark_ledger.csv"
          test -s "${RUNNER_TEMP}/anatomy/${symbol}/fingerprint_levels.csv"
          for year in 2015 2016 2017 2018 2019; do
            test -s "${RUNNER_TEMP}/source/${symbol}/${lower}_m1_bid_${year}.csv.gz"
            test -s "${RUNNER_TEMP}/source/${symbol}/${lower}_m1_ask_${year}.csv.gz"
          done
      - name: Build pair continuation geometry
        run: |
          out="${RUNNER_TEMP}/continuation/${{ matrix.symbol }}"
          mkdir -p "${out}"
          python scripts/run_asia_sweep_continuation_geometry_pair.py \
            --data "${RUNNER_TEMP}/source/${{ matrix.symbol }}" \
            --predictions "${RUNNER_TEMP}/triage/selected_continuation_predictions.csv" \
            --ledger "${RUNNER_TEMP}/early-entry/early_entry_landmark_ledger.csv" \
            --levels "${RUNNER_TEMP}/anatomy/${{ matrix.symbol }}/fingerprint_levels.csv" \
            --symbol "${{ matrix.symbol }}" \
            --out "${out}"
      - name: Upload pair geometry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asia-sweep-continuation-geometry-${{ matrix.symbol }}
          path: ${{ runner.temp }}/continuation/${{ matrix.symbol }}
          if-no-files-found: warn
          retention-days: 90

  geometry_gate:
    name: Enforce continuation geometry decision
    needs: pair_geometry
    if: always() && needs.pair_geometry.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Download pair evidence
        uses: actions/download-artifact@v4
        with:
          pattern: asia-sweep-continuation-geometry-*
          path: ${{ runner.temp }}/continuation-inputs
          merge-multiple: false
      - name: Enforce pair evidence count
        shell: bash
        run: |
          set -euo pipefail
          test "$(find "${RUNNER_TEMP}/continuation-inputs" -name continuation_geometry.csv | wc -l)" -eq 2
      - name: Aggregate frozen geometry gate
        run: |
          mkdir -p "${RUNNER_TEMP}/continuation-decision"
          python scripts/aggregate_asia_sweep_continuation_geometry.py \
            --inputs "${RUNNER_TEMP}/continuation-inputs" \
            --out "${RUNNER_TEMP}/continuation-decision"
      - name: Upload complete geometry decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asia-sweep-continuation-geometry-decision
          path: ${{ runner.temp }}/continuation-decision
          if-no-files-found: warn
          retention-days: 90
      - name: Enforce scientific decision
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          decision="${RUNNER_TEMP}/continuation-decision/continuation_geometry_decision.json"
          test -s "${decision}"
          python - "${decision}" <<'PY'
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          print(json.dumps(payload, indent=2, sort_keys=True))
          expected = "PASS_CONTINUATION_GEOMETRY_AUTHORIZE_EXECUTION_DISCOVERY"
          raise SystemExit(0 if payload.get("decision") == expected else 1)
          PY
